name: Build Android & Windows Store Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk) & Google Play Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Client & Copy to Android Assets
        run: |
          npm ci
          npm run build
          # Clean first: assets/www is committed with a stale build and cp would
          # leave orphan hashed bundles from earlier releases inside the APK.
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Build Android APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          # Repo variable: Settings -> Secrets and variables -> Actions -> Variables.
          # Unset => APK uses its bundled assets rather than a stale quick tunnel.
          STREAMCUT_SERVER_URL: ${{ vars.STREAMCUT_SERVER_URL }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PstreamcutServerUrl="${STREAMCUT_SERVER_URL}"

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StreamCut.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamCut-Android-APK
          path: StreamCut.apk

      - name: Attach APK to GitHub Release v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 StreamCut.apk --clobber || true

  build-windows-exe:
    name: Package Native Windows Executable (.exe) & Store Artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Client
        run: |
          npm ci
          npm run build

      - name: Compile Native StreamCut.exe
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/make-ico.ps1
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32icon:public\app.ico /out:StreamCut.exe tools\StreamCutLauncher.cs

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: StreamCut-Windows-Executable
          path: |
            StreamCut.exe
            windows/AppxManifest.xml
            public/
            scripts/install-windows-app.ps1

      - name: Attach Windows Executable to GitHub Release v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 StreamCut.exe --clobber || true
