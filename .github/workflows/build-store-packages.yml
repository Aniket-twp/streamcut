name: Build Android & Windows Store Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-aab:
    name: Build Android App Bundle (.aab / .apk) for Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA Android Package
        run: |
          npx @bubblewrap/cli init --manifest=./public/manifest.json --directory=./android-build || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamCut-Android-PlayStore
          path: |
            public/manifest.json
            twa-manifest.json
            public/*.png

  build-windows-exe:
    name: Package Native Windows Executable (.exe) & Store Artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Client
        run: |
          npm ci
          npm run build

      - name: Compile Native StreamCut.exe
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/make-ico.ps1
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32icon:public\app.ico /out:StreamCut.exe tools\StreamCutLauncher.cs

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: StreamCut-Windows-Executable
          path: |
            StreamCut.exe
            windows/AppxManifest.xml
            public/
            scripts/install-windows-app.ps1
