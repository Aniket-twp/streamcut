plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streamcut.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.streamcut.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Where the app finds its backend. Set at build time with
        //   ./gradlew assembleRelease -PstreamcutServerUrl=https://streamcut.up.railway.app
        // (the APK workflow does this from the repo variable). Empty means
        // "no remote backend configured" and the app runs from its bundled
        // assets instead of pointing at a dead Cloudflare quick tunnel.
        buildConfigField "String", "STREAMCUT_SERVER_URL",
                "\"${project.findProperty('streamcutServerUrl') ?: ''}\""
    }

    buildFeatures {
        // AGP 8 stopped generating BuildConfig unless asked.
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
